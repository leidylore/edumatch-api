# Configuración de la base de datos MySQL (cambia usuario y contraseña por los tuyos)
spring.datasource.url=jdbc:mysql://localhost:3306/edumatch?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=1234567

# Hibernate crea/actualiza las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Puerto del servidor
server.port=8080
